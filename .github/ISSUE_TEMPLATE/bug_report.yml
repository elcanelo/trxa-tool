name: Bug report
description: Something in TRXA-TOOL or TRXA Studio doesn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        **Don't include real business data.** Issues are public. Before you paste a recording, a test file, a log or a screenshot, remove account numbers, names, amounts and anything else from a real company. Never paste a client secret.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem in a sentence or two.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The steps that lead to the problem.
      placeholder: |
        1. Open Studio and select Recordings.
        2. Select a recording.
        3. Select Suggest inputs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TRXA-TOOL version
      description: Run `trxa --version`, or see the TRXA CLI row in Studio's Settings > Agent runs.
      placeholder: trxa-tool 0.2.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install TRXA-TOOL?
      options:
        - Windows app, portable zip
        - Windows app, installer
        - npm package
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does the problem happen?
      options:
        - Studio
        - An agent run started from Studio
        - The trxa command line
        - Installation or setup
        - Other
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      description: Only if the problem involves an agent run.
      options:
        - Not applicable
        - GitHub Copilot CLI
        - Claude Code
        - Other
  - type: input
    id: environment
    attributes:
      label: Dynamics 365 version (optional)
      description: Only if the problem involves an agent run, for example 10.0.47.
  - type: textarea
    id: logs
    attributes:
      label: Error messages or logs (optional)
      description: Paste any error text. Remove real business data and secrets first.
      render: text
  - type: checkboxes
    id: data
    attributes:
      label: Data check
      options:
        - label: This issue contains no real business data and no secrets.
          required: true
