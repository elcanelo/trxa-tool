name: Feature request
description: Suggest an idea or an improvement for TRXA-TOOL or TRXA Studio.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Issues are public, so don't include real business data.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task or the problem, not only the solution. For example, "I test the same process in five companies, and I have to create a fixture for each one by hand."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: How you'd like TRXA-TOOL to solve it.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Studio
        - Agent runs
        - The trxa command line
        - Recordings and test scripts
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today? (optional)
      description: Any workaround you use now.
